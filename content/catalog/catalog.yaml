# The release manifest: what the public site lists. The site reads this file
# at build time and `npm run validate` checks it (see content/catalog/README.md).
#
# A lab appears only once it is listed under `labs:` with its metadata in
# labs/<id>.json. It becomes downloadable only when its entry says
# `status: released`, with the date of its learner read and a hosted file.
schema: labpack-site.catalog.v1
kind: release

client:
  name: Full Mesh Labs
  channel: beta
  version: 0.1.0b2
  build: c13612c
  fileName: FullMeshLabs-signed-c13612c.zip
  bytes: 49065260
  sha256: 975d664fa7b1e059ee17f8d98dc885907f4afa214541bf764164be6dbe980593
  # The release file the Download button sends a visitor on to (docs/publishing.md).
  url: https://github.com/jncia/full-mesh-labs-releases/releases/download/v0.1.0b2/FullMeshLabs-signed-c13612c.zip
  publisher: Benjamin Jacobson
  platform: Windows 11
  requirements:
    - Windows 11
    - 12 GB of memory or more
    - About 12 GB of free disk space, most of it for the router image
    - An Intel processor. AMD is not tested yet; the app lets you try.

levels:
  - id: jncia-junos
    name: JNCIA-Junos
    track: Junos
    stage: associate
    status: available
    note: The first lab is out. The others are in their final review.
  - id: jncis-sp
    name: JNCIS-SP
    track: Service provider
    stage: specialist
    status: planned
    note: Labs for the JNCIS-SP course are being planned.
  - id: jncip-sp
    name: JNCIP-SP
    track: Service provider
    stage: professional
    status: later
    note: Later. No date yet.
  - id: jncie-sp
    name: JNCIE-SP
    track: Service provider
    stage: expert
    status: later
    note: Later. No date yet.

# What a learner needs to download a lab. `delivered` says whether the site can
# hand out a download in that tier today; a lab in a tier that is not delivered
# cannot be released (the validator refuses it).
access:
  - id: open
    name: Free, no account
    short: No account
    note: No sign-up and no email address.
    delivered: true
  - id: free-account
    name: Free account
    short: Free account
    note: Free with a Full Mesh Labs account.
    delivered: false
  - id: course
    name: With the course
    short: With the course
    note: Comes with the course purchase.
    delivered: false
  - id: subscription
    name: Full Mesh Labs subscription
    short: Subscription
    note: Part of the Full Mesh Labs subscription.
    delivered: false

# The access rule (owner direction, 2026-11-20): course labs at associate and
# specialist level need no account; library labs there need a free account.
# At professional and expert level, course labs come with the course purchase
# and library labs need a Full Mesh Labs subscription. A collection's access follows
# from its kind and its level's stage; it is never set by hand.
accessRule:
  course:
    associate: open
    specialist: open
    professional: course
    expert: course
  library:
    associate: free-account
    specialist: free-account
    professional: subscription
    expert: subscription

collections:
  - id: jncia-course
    title: JNCIA-Junos course labs
    short: Course labs
    summary: Six labs written to go with the JNCIA-Junos video course. Each practises what a part of the course teaches.
    level: jncia-junos
    kind: course
    # Labs in review that are not listed below yet. Shown as a count only.
    unlistedInReview: 0
  - id: practice-library-v1
    title: JNCIA practice library
    short: Practice library
    summary: Standalone labs at JNCIA level, each built around one task. They assume no course.
    level: jncia-junos
    kind: library
    unlistedInReview: 16

topicGroups:
  - id: config
    name: Configuration
  - id: addressing
    name: Interfaces and addressing
  - id: static
    name: Static routing
  - id: ospf
    name: OSPF
  - id: policy
    name: Routing policy
  - id: filters
    name: Firewall filters
  - id: troubleshooting
    name: Troubleshooting

labs:
  - { id: jncia-practice-1-change-the-router-safely, collection: jncia-course, status: in-review }
  - id: jncia-practice-2-address-the-lab-router
    collection: jncia-course
    status: released
    learnerReadOn: 2026-11-24
    download:
      url: https://github.com/jncia/full-mesh-labs-releases/releases/download/jncia-course-v1/jncia-practice-2-address-the-lab-router.labpack
      fileName: jncia-practice-2-address-the-lab-router.labpack
      bytes: 16525
      sha256: 22b2e68ccee9c81f179b5a8db05f1f5cce4ed69f0bff91bb2a869e77eb79f315
  - { id: jncia-practice-3-find-and-fix-the-fault, collection: jncia-course, status: in-review }
  - { id: jncia-practice-4-routes-by-hand, collection: jncia-course, status: in-review }
  - { id: jncia-practice-5-policy-on-ospf, collection: jncia-course, status: in-review }
  - { id: jncia-practice-6-filter-and-protect, collection: jncia-course, status: in-review }
