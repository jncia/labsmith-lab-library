# The release manifest: what the public site lists. The site reads this file
# at build time and `npm run validate` checks it (see content/catalog/README.md).
#
# A lab appears only once it is listed under `labs:` with its metadata in
# labs/<id>.json. It becomes downloadable only when its entry says
# `status: released`, with the date of its learner read and a hosted file.
schema: labpack-site.catalog.v1
kind: release

client:
  name: LabPack
  channel: beta
  build: 6dda438
  fileName: LabPack-signed-6dda438.zip
  bytes: 48974464
  sha256: 1d68ad3c92ce10b2e86cb5b2521dc56201136c130769c8588a4b6d0f1e953ede
  # null until the download host is chosen; then an https:// address.
  url: null
  publisher: Benjamin Jacobson
  platform: Windows 11
  requirements:
    - Windows 11
    - 12 GB of memory or more
    - About 12 GB of free disk space, most of it for the router image
    - An Intel processor. AMD is not tested yet; LabPack lets you try.

levels:
