id: interprovider-option-b-6n
title: Inter-provider MPLS VPN Option B
summary: Six-node inter-provider scenario with two ASBRs exchanging VPNv4 routes, separate provider
  cores, and a guided failure around next-hop reachability.
status: planned
difficulty: Advanced
vendor: Juniper vJunos-router
node_count: 6
topology_family: interprovider-option-b-6n
technologies:
  - MPLS
  - Inter-provider
  - Option B
  - MP-BGP
  - L3VPN
scenarios:
  - ASBR-to-ASBR VPNv4 exchange
  - Next-hop-self behavior
  - Provider boundary troubleshooting
  - Route-target preservation
devices:
  - id: asbr-a
    role: provider A ASBR
  - id: asbr-b
    role: provider B ASBR
verification:
  last_run: pending
  mode: planned archetype
  assertions: not yet pinned
  notes:
    - Included to reserve the six-node inter-provider pattern.
    - Needs a dedicated LabSmith archetype and live verification.
