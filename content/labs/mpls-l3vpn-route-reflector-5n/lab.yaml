id: mpls-l3vpn-route-reflector-5n
title: MPLS L3VPN with Route Reflector Core
summary: Five-node Junos service-provider floor with PE routers, a core route reflector, dual
  customer edges, VPNv4 control plane, LDP transport, and a guided import/export failure exercise.
status: verified
difficulty: Advanced
vendor: Juniper vJunos-router
node_count: 5
topology_family: sp-vpn-floor-5n
technologies:
  - MPLS
  - L3VPN
  - MP-BGP
  - Route Reflector
  - LDP
  - VRF
scenarios:
  - VPNv4 route reflection
  - VRF target import/export
  - Remote customer loopback reachability
  - Broken route target repair
devices:
  - id: pe1
    role: provider edge
  - id: p1
    role: core route reflector
  - id: pe2
    role: provider edge
  - id: ce1
    role: customer edge
  - id: ce2
    role: customer edge
verification:
  last_run: 2026-07-07
  mode: LabSmith live proof seed
  assertions: 12 baseline assertions
  notes:
    - Uses the current LabSmith sp-vpn-floor-5n archetype as the first public seed.
    - Public files intentionally omit host details, credentials, image digests, and raw private logs.
diagram:
  nodes:
