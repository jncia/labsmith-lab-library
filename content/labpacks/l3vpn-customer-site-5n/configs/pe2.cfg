system {
    host-name pe2;
}
interfaces {
    ge-0/0/0 {
        unit 0 {
            family inet {
                address 172.16.12.1/30;
            }
        }
    }
    ge-0/0/1 {
        unit 0 {
            family inet {
                address 10.0.23.1/31;
            }
            family mpls;
        }
    }
    ge-0/0/2 {
        encapsulation ethernet-ccc;
        unit 0 {
            family ccc;
        }
    }
    lo0 {
        unit 0 {
            family inet {
                address 10.255.0.3/32;
            }
        }
    }
}
routing-instances {
    CUST-A {
        instance-type vrf;
        routing-options {
            autonomous-system 65000;
        }
        protocols {
            bgp {
                group CE {
                    type external;
                    neighbor 172.16.12.2 {
                        peer-as 65100;
                        as-override;
                    }
                }
            }
        }
        interface ge-0/0/0.0;
        route-distinguisher 65000:102;
        vrf-target target:65000:100;
    }
}
routing-options {
    router-id 10.255.0.3;
    autonomous-system 65000;
}
protocols {
    bgp {
        group IBGP {
            type internal;
            local-address 10.255.0.3;
            family inet-vpn {
                unicast;
            }
            neighbor 10.255.0.2 {
                peer-as 65000;
            }
        }
    }
    l2circuit {
        neighbor 10.255.0.1 {
            interface ge-0/0/2.0 {
                virtual-circuit-id 200;
            }
        }
    }
    ldp {
        interface ge-0/0/1.0;
        interface lo0.0;
    }
    mpls {
        interface ge-0/0/1.0;
    }
    ospf {
        area 0.0.0.0 {
            interface lo0.0 {
                passive;
            }
            interface ge-0/0/1.0 {
                interface-type p2p;
            }
        }
    }
}
