system {
    host-name pe1;
}
interfaces {
    ge-0/0/0 {
        unit 0 {
            family inet {
                address 172.16.11.1/30;
            }
        }
    }
    ge-0/0/1 {
        unit 0 {
            family inet {
                address 10.0.12.0/31;
            }
            family mpls;
        }
    }
    lo0 {
        unit 0 {
            family inet {
                address 10.255.0.1/32;
            }
        }
    }
}
routing-options {
    router-id 10.255.0.1;
    autonomous-system 65000;
}
protocols {
    bgp {
        group IBGP {
            type internal;
            local-address 10.255.0.1;
            family inet-vpn {
                unicast;
            }
            neighbor 10.255.0.2 {
                peer-as 65000;
            }
        }
    }
    ldp {
        interface ge-0/0/1.0;
        interface lo0.0;
    }
    mpls {
        interface ge-0/0/1.0;
    }
    ospf {
        area 0.0.0.0 {
            interface lo0.0 {
                passive;
            }
            interface ge-0/0/1.0 {
                interface-type p2p;
            }
        }
    }
}
