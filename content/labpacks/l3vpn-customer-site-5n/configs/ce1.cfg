system {
    host-name ce1;
}
interfaces {
    ge-0/0/0 {
        unit 0 {
            family inet {
                address 172.16.11.2/30;
            }
        }
    }
    ge-0/0/1 {
        unit 0 {
            family inet {
                address 172.16.12.2/30;
            }
        }
    }
    lo0 {
        unit 1 {
            family inet {
                address 192.0.2.1/32;
            }
        }
        unit 2 {
            family inet {
                address 198.51.100.1/32;
            }
        }
    }
}
policy-options {
    policy-statement EXPORT-SITE1 {
        term LOOP {
            from {
                route-filter 192.0.2.1/32 exact;
            }
            then accept;
        }
        term REJECT {
            then reject;
        }
    }
    policy-statement EXPORT-SITE2 {
        term LOOP {
            from {
                route-filter 198.51.100.1/32 exact;
            }
            then accept;
        }
        term REJECT {
            then reject;
        }
    }
}
routing-instances {
    SITE1 {
        instance-type virtual-router;
        routing-options {
            autonomous-system 65100;
        }
        protocols {
            bgp {
                group PE {
                    type external;
                    export EXPORT-SITE1;
                    neighbor 172.16.11.1 {
                        peer-as 65000;
                    }
                }
            }
        }
        interface ge-0/0/0.0;
        interface lo0.1;
    }
    SITE2 {
        instance-type virtual-router;
        routing-options {
            autonomous-system 65100;
        }
        protocols {
            bgp {
                group PE {
                    type external;
                    export EXPORT-SITE2;
                    neighbor 172.16.12.1 {
                        peer-as 65000;
                    }
                }
            }
        }
        interface ge-0/0/1.0;
        interface lo0.2;
    }
}
