schemaVersion: 0
id: jncia-local-routing-policy-1n
title: Local Addressing, Static Routes, and Contributor Policy
summary: On a single router, r1, you add a second loopback endpoint, create discard
  and reject static routes for two planned networks, and use an aggregate contributor
  policy so that only 172.16.0.0/16 is active and 172.17.0.0/16 disappears.
labType: build
level: associate
certifications:
- JNCIA-Junos
topics:
- loopback addressing
- static discard and reject routes
- routing policy terms
- aggregate contributor policy
- operational verification
estimatedMinutes: 35
nodes:
- id: r1
  kind: juniper_vjunosrouter
  role: Router-local addressing and routing-policy practice
requirements:
  images:
  - kind: juniper_vjunosrouter
    version: 26.2R1.7
    obtainFrom: Build the container image from the vendor's virtual router release
      with vrnetlab, then load it on the lab host.
  minimumFreeMemoryGb: 8
  minimumCores: 4
stages:
- id: s1
  title: Establish the local service endpoint
  goal: Give r1 the service address 192.0.2.2/32 on lo0.0, alongside the existing
    diagnostic 192.0.2.1.
  doneWhen:
  - lo0.0 carries 192.0.2.2/32 and inet.0 has a route for it
  - r1 pings 192.0.2.2 with no loss
- id: s2
  title: Represent the two planned networks
  goal: Create local routes for 172.16.10.0/24 with a discard next hop and 172.17.10.0/24
    with a reject next hop. Neither needs a gateway.
  doneWhen:
  - 172.16.10.0/24 is an active Static route in inet.0 and its forwarding entry is
    a discard
  - 172.17.10.0/24 is an active Static route in inet.0 and its forwarding entry is
    a reject
- id: s3
  title: Admit only the approved contributor
  goal: Make 172.16.0.0/16 an active aggregate whose only contributor is the exact
    approved route 172.16.10.0/24. Make 172.17.0.0/16 absent from inet.0. Keep both
    static routes and 192.0.2.2 working.
  doneWhen:
  - 172.16.0.0/16 is an active Aggregate route in inet.0
  - inet.0 has no route for 172.17.0.0/16
  - Both static routes and 192.0.2.2 still work
