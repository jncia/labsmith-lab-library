  brief:
    schemaVersion: 0
    id: jncia-loopback-filter-1n
    title: Selective ICMP Access to Local Router Endpoints
    labType: build
    level: associate
    certifications:
    - JNCIA-Junos
    blueprint:
      examCode: JN0-106
      objectives:
      - OBJ-5-1
      - OBJ-5-4
      - OBJ-7-7
      - OBJ-7-8
      - OBJ-7-9
      - OBJ-7-10
    topics:
    - loopback firewall filtering
    - filter term order
    - ICMP match criteria
    - accept and discard actions
    - operational verification
    scenario: One ordinary router has three local service addresses and a separate
      diagnostic address. Its two wired data ports are joined to each other, with
      no additional node or logical system. The starting loopback filter blocks the
      two services intended for testing and permits a service that should be isolated.
      Restore the intended ICMP access without disturbing diagnostics or unrelated
      traffic.
    learnerOutcome: Use ordered firewall-filter terms and precise ICMP destination
      matches to permit two local services and block a third, then verify those effects
      with router-originated ping observations.
    startStateSketch: One initialized vJunos-router r1 has one same-router link between
      distinct host-assigned data ports, already up/up and retained throughout; there
      are no other nodes or logical systems. lo0.0 owns diagnostic address 192.0.2.254/32
      and service addresses 192.0.2.10/32, 192.0.2.20/32, and 192.0.2.30/32. A narrow
      loopback ICMP filter initially denies self-ping to .10 and .20, permits self-ping
      to .30, and permits diagnostics and all unrelated traffic. All local address
      routes remain present throughout. The engineer must measure that self-ping traverses
      the chosen filter before submission; if it bypasses the filter, this brief is
      not runnable.
    stageSketch:
    - title: Restore the first service
      achieves: Done when r1 can ping 192.0.2.10, and diagnostic address 192.0.2.254
        remains reachable.
    - title: Complete the service access policy
      achieves: Done when r1 can ping both 192.0.2.10 and 192.0.2.20, cannot ping
        192.0.2.30, and diagnostic address 192.0.2.254 remains reachable.
    observableOutcomes:
    - Router-originated ping to 192.0.2.10 changes from failure in the start state
      to success after stage one and remains successful.
    - Router-originated ping to 192.0.2.20 changes from failure in the start state
      to success after stage two.
    - Router-originated ping to 192.0.2.30 changes from success in the start state
      to failure after stage two.
    - Router-originated ping to diagnostic address 192.0.2.254 remains successful
      through both stages.
    - Both distinct self-linked data ports report administrative and operational up
      throughout the exercise.
    topology:
      nodes:
      - id: r1
        kind: vjunos-router
        role: Local ICMP access controlled by a loopback filter
      links:
      - a: r1
        b: r1
    estimatedMinutes: 25
    rationale: This different objective family uses existing ping outcomes. Start
      only after the first packet qualifies cleanly. The engineer must prove that
      router-originated ping traverses the chosen lo0 filter on this one-router image.
      Counter tasks are omitted because existing checks reject changing counters.
      If filter effects cannot be observed, park the second packet and preserve the
      failure. Do not add another node, logical systems, a new check type, or configuration-text
      checks.
