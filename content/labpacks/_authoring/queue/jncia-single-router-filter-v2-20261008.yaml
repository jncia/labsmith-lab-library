    id: jncia-loopback-filter-1n-v2
    labType: build
    learnerOutcome: Use ordered ICMP filter terms to allow all three probes to two
      local services and give zero replies from a third, while independently proving
      each of the four addresses remains on lo0.0, its Direct host route remains,
      and diagnostics stay reachable.
    level: associate
    observableOutcomes:
    - Three router-originated probes to 192.0.2.10 change from zero replies at original
      start to three replies after stage one and remain successful.
    - Three router-originated probes to 192.0.2.20 change from zero replies at original
      start to three replies after stage two.
    - Three router-originated probes to 192.0.2.30 change from three replies at original
      start to zero replies after stage two; partial loss does not meet denial.
    - All three diagnostic 192.0.2.254 probes reply at original start, after both
      stages and after reset; this is baseline, not a stage target.
    - Four generic state-match checks select separate interface-address records from
      operational lo0.0 inet readback, identifying local .10, .20, .30 and .254. Four
      Direct /32 route guards remain separate; no new check type is required.
    - Both distinct self-linked data ports remain administrative and operational up;
      this is baseline, not a stage target.
    - 'Only three changing service effects are stage targets: .10 succeeds in stage
      one, then .20 succeeds and .30 returns zero replies in stage two. Earlier targets
      remain true cumulatively.'
    - All four captured lo0.0 address record guards pass at original start/reset and
      after both stages. Denial requires these guards and each Direct host route;
      removing or moving an endpoint cannot count as success.
    rationale: This teaches local ICMP matches, term order and packet effects. Measure
      genuine self-originated lo0 traversal or park. Capture all four live lo0.0 inet
      address rows, then use generic state-match with its existing interface-address
      record to select each independently; use observed fields, not assumed prefix
      suffixes or destination values. Baseline also retains four Direct /32 routes,
      both ports and diagnostic ping. Allows use count 3, rate 1; denial uses count
      3, negate true and rate 0.01. All guards persist through both stages; no new
      check type or counter goal.
    scenario: One ordinary router has three local service addresses and a diagnostic
      address. Its two wired data ports are joined to each other, with no additional
      node or logical system. A loopback ICMP filter initially blocks two service
      probes and permits the service to be isolated. Restore the intended responses
      for the named endpoints while keeping all local addresses, routes and diagnostics
      intact.
    schemaVersion: 0
    stageSketch:
    - achieves: Done when all three r1 probes to 192.0.2.10 reply, each of the four
        addresses is still operationally identified on lo0.0, each Direct host route
        remains, both wired ports are up/up and all three diagnostic probes reply.
      title: Restore the first service
    - achieves: Done when all three .20 probes reply, zero .30 probes reply and earlier
        .10 replies persist; all four addresses remain operationally identified on
        lo0.0, all Direct host routes remain, both ports stay up/up and diagnostic
        replies persist.
      title: Complete the service access policy
    startStateSketch: One vJunos-router r1 has one same-router wire between its distinct
      first two data ports, up/up. lo0.0 owns diagnostic 192.0.2.254/32 and services
      192.0.2.10/32, .20/32 and .30/32. Baseline independently identifies each local
      address on lo0.0 in inet using captured state-match interface-address records,
      retains each Direct /32 route in inet.0, both ports up and three diagnostic
      replies. Routes alone are insufficient. Capture all four actual operational
      address rows before selecting them independently; do not assume prefix suffixes
      or destination values. The filter initially gives zero replies to three-probe
      self-pings of .10 and .20, and three replies from .30 and .254. Only changing
      service effects are stage targets, all false at original start/reset. Measure
      filter traversal or park.
    title: Selective ICMP Access to Local Router Endpoints
