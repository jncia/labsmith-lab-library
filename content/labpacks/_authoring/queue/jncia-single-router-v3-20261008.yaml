    schemaVersion: 0
    id: jncia-local-routing-policy-1n-v3
    title: Interface Addressing, Static Routes, and Contributor Policy
    labType: build
    level: associate
    certifications:
    - JNCIA-Junos
    blueprint:
      examCode: JN0-106
      objectives:
      - OBJ-1-5
      - OBJ-5-1
      - OBJ-5-4
      - OBJ-6-2
      - OBJ-6-6
      - OBJ-7-3
      - OBJ-7-4
      - OBJ-7-5
      - OBJ-7-6
    topics:
    - interface and loopback addressing
    - static discard and reject routes
    - routing policy terms
    - aggregate contributor policy
    - active and hidden route views
    - operational verification
    scenario: You are preparing one ordinary router for a small local routing exercise.
      Two data ports are joined by a same-router wire, with no second node or logical
      system. Keep the diagnostic loopback, add a service endpoint on the first wired
      interface and two planned static routes, then admit the approved aggregate contributor
      while rejecting the other. Keep the rejected aggregate as a hidden, inactive
      route so you can distinguish policy exclusion from deleting its definition.
    learnerOutcome: Verify exact 192.0.2.2/24 on ge-0/0/0.0 directly from operational
      interface state and its measured Direct subnet route, distinguish static discard
      and reject actions, and use routing policy to activate an approved aggregate
      while retaining an unwanted aggregate as hidden rather than installed.
    startStateSketch: One initialized vJunos-router r1 has one same-router link between
      distinct host-assigned data ports, already up/up, with no other nodes or logical
      systems. Diagnostic 192.0.2.1/32 remains on lo0.0. Service 192.0.2.2/24 on ge-0/0/0.0,
      Direct subnet 192.0.2.0/24, statics 172.16.10.0/24 and 172.17.10.0/24, and aggregate
      172.16.0.0/16 are absent. Unwanted aggregate 172.17.0.0/16 is passive, active
      in the ordinary route view, and absent from the hidden view. All stage checks
      evaluate false at this original start and reset; healthy port up/up is baseline,
      not an independent stage check. A stable discard property on the unwanted summary
      is optional if native derivation needs it, without making a stage check pass
      at start.
    stageSketch:
    - title: Establish the exact local service endpoint
      achieves: Done when operational interface state reports 192.0.2.2/24 on ge-0/0/0.0,
        inet.0 has measured active Direct 192.0.2.0/24, and r1 pings the service address.
        Route or ping alone does not prove the interface or mask.
    - title: Represent the two planned networks
      achieves: Done when 172.16.10.0/24 is an active Static discard route and 172.17.10.0/24
        an active Static reject route, with their forwarding actions verified and
        the earlier endpoint outcome preserved.
    - title: Distinguish rejected contribution from route deletion
      achieves: Done when 172.16.0.0/16 is active Aggregate, 172.17.0.0/16 remains
        an exact Aggregate in the hidden view and is absent from the ordinary route
        view, and both statics and the exact endpoint remain.
    observableOutcomes:
    - Operational interface state directly identifies ge-0/0/0.0 with exactly 192.0.2.2/24;
      a different interface or configured mask does not satisfy this outcome.
    - inet.0 contains exact active 192.0.2.0/24 with its native Direct protocol measured
      from route state, and r1 successfully pings 192.0.2.2.
    - 172.16.10.0/24 is active Static with discard next hop, and its forwarding entry
      has the measured discard action.
    - 172.17.10.0/24 is active Static with reject next hop, and its forwarding entry
      has the measured reject action.
    - 172.16.0.0/16 is an active Aggregate after its exact approved contributor is
      accepted.
    - The hidden-route operational view directly reports exact unwanted Aggregate
      172.17.0.0/16 retained but inactive after its active static contributor is rejected.
    - The ordinary route view contains no entry for aggregate 172.17.0.0/16 while
      the hidden view retains it; this is not a claim that the prefix vanished from
      every RIB view.
    - Both component statics and the exact interface-address and ping outcomes of
      earlier stages remain true at final handover.
    - Both distinct self-linked ports remain administrative and operational up as
      baseline health, and diagnostic 192.0.2.1/32 remains on lo0.0 and reachable
      throughout.
