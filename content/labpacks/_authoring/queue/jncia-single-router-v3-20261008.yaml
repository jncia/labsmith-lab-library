    rationale: 'Use the physical-interface address/prefix readback and connected route
      to distinguish mask and placement. Before submission, measure two isolated alternatives
      with existing tools: service 192.0.2.2/32 on ge-0/0/0.0, and 192.0.2.2/24 on
      ge-0/0/1.0. Restore the intended state after each trial. Explain which interface
      and route fields changed; do not claim route or ping alone identifies the interface.
      Ordinary and hidden route views distinguish policy exclusion from deletion.'
