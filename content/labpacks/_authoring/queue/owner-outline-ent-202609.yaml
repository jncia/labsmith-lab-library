skippedObjectives:
- objective: C01-C01V01
  reason: An introduction to the learning path. It has no skill to practise or observe.
- objective: C01-C01V02
  reason: Switched versus shared LAN and bridging concepts need an Ethernet switching
    node. The platform offers only routers, and no check reads bridging state.
- objective: C01-C01V03
  reason: MAC learning and forwarding are observed in the MAC table. No check type
    reads it, and the platform has no switch node.
- objective: C01-C01V04
  reason: Flooding, filtering and aging are bridging behaviours. There is no switch
    node and no check can show them.
- objective: C01-C01V05
  reason: Three-tier design and collapsed core is a design topic, and the platform
    cannot build or observe switch layers.
- objective: C01-C01V06
  reason: EX series platform differences are about hardware and cannot be built or
    observed.
- objective: C01-C01V07
  reason: Frame processing for unknown and known MAC destinations needs a switch node
    and MAC table observation. The platform offers neither.
- objective: C01-C01V08
  reason: Layer 2 forwarding troubleshooting needs bridging tables and frame counters.
    No check reads them.
- objective: C01-C01V09
  reason: VLANs and access ports need Ethernet switching. The router node kind and
    checks cannot show VLAN membership.
- objective: C01-C01V10
  reason: 802.1Q trunking, voice VLAN and native VLAN need switch ports. No check
    reads tags or port modes.
- objective: C01-C01V11
  reason: Inter-VLAN routing depends on VLANs on a switch with IRB interfaces. Without
    a switch node and VLAN observation it would be bent into something else.
- objective: C01-C01V12
  reason: The VLAN lab depends on the VLAN, trunk and IRB objectives above, none of
    which the platform can build or observe.
- objective: C02-C02V01
  reason: Network storms and loop formation need a switched, looped topology and cannot
    be observed with the platform's checks.
- objective: C02-C02V02
  reason: STP port types, states and timers need a switch node. No check reads spanning-tree
    state, and timer values are also refused as configuration.
- objective: C02-C02V03
  reason: RSTP port roles and states cannot be built on router nodes or read by any
    check.
- objective: C02-C02V04
  reason: Configuring and troubleshooting STP/RSTP needs a switch node and spanning-tree
    state observation.
- objective: C02-C02V05
  reason: BPDU, loop and root guard and storm control depend on spanning tree on switch
    ports, and none is observable.
- objective: C02-C02V06
  reason: Ethernet ring protection needs a ring of switches and ring state observation,
    which the platform lacks.
- objective: C02-C02V07
  reason: MAC limiting and persistent MAC learning need switch ports and a MAC table.
    No check can show them.
- objective: C02-C02V08
  reason: DHCP snooping, DAI and IP source guard need switch ports, DHCP clients and
    binding table observation. The platform has none of these.
- objective: C02-C02V09
  reason: Layer 2 firewall filters and storm control act on bridged frames. The platform
    has no switch node, and the checks cannot see filter matches or drops.
- objective: C02-C02V10
  reason: The layer 2 security lab depends on the switching-only features above, and
    none can be built or observed.
- objective: C03-C03V02
  reason: Martian routes are observable in principle as an absent route, but were
    left out of this batch in favour of objectives with more hands-on work. They could
    be added as a stage to the static route brief.
- objective: C03-C03V05
  reason: Filter-based forwarding needs a check that shows which path a matched packet
    takes. Ping only reports success rate, and the forwarding-table check does not
    show filter matches.
- objective: C04-C04V02
  reason: OSPF packet types, adjacency states and DR/BDR election are not observable,
    because the platform has no OSPF neighbour or DR check. Only their effect on routes
    can be seen.
- objective: C04-C04V03
  reason: LSA types and the LSDB contents cannot be read by any check type.
- objective: C05-C04V01
  reason: IS-IS overview of adjacencies and levels is theory. Its practical part is
    covered by the multi-level brief.
- objective: C05-C04V02
  reason: IS-IS adjacency formation and DIS election are not observable, because no
    check reads IS-IS neighbours or the DIS.
- objective: C05-C04V03
  reason: PDU formats and TLVs are packet-level content, and no check can observe
    them.
- objective: C06-C06V03
  reason: BGP message types and the state machine cannot be observed beyond the neighbour
    state check. Message exchange per state has no check.
- objective: C07-C07V01
  reason: Purely theory on tunnel use cases. There is no device outcome to observe.
- objective: C08-C08V02
  reason: Virtual Chassis needs switch nodes, and graceful restart and GRES need dual
    routing engines and chassis and system configuration the platform cannot reset.
- objective: C08-C08V03
  reason: Nonstop routing and bridging need dual routing engines, which the single-node
    kind does not have, plus chassis configuration. No check observes their state.
- objective: C08-C08V04
  reason: VRRP needs a shared segment and BFD needs session state observation. Links
    are point to point only, and no check reads VRRP mastership or BFD sessions.
- objective: C08-C08V05
  reason: ISSU needs dual routing engines, a software image and a chassis state that
    the platform cannot provide or observe.
