  brief:
    schemaVersion: 0
    id: routing-instance-rib-group-3n
    title: Put a customer in a virtual router and share routes with a RIB group
    labType: build
    level: intermediate
    certifications:
    - JNCIS-ENT
    blueprint:
      examCode: OWNER-OUTLINE-ENT
      objectives:
      - C03-C03V03
    topics:
    - virtual-router instance
    - RIB groups
    - route leaking
    scenario: An edge router serves a customer site that must be kept in its own routing
      table, but the customer needs to reach one shared upstream service and the upstream
      must reach back to the customer. The router currently has everything in the
      main table.
    learnerOutcome: Isolate an interface in a virtual-router instance and use a RIB
      group to copy only the needed routes between it and the main table.
    startStateSketch: An edge router with a link to a customer router and a link to
      an upstream router, all in the main routing table with addresses in place. Each
      far router has a loopback.
    stageSketch:
    - title: Isolate the customer
      achieves: The customer-facing interface and its connected route live in a named
        virtual-router instance, and the customer prefix is gone from the main table.
    - title: Bring the upstream service into the instance
      achieves: The instance's table has a route to the upstream loopback, and the
        customer router can reach it through the instance.
    - title: Give the upstream a way back
      achieves: The main table has a route to the customer prefix copied by a RIB
        group, and the upstream loopback can reach the customer router.
    observableOutcomes:
    - The customer prefix is in the instance's routing table.
    - The customer prefix is absent from the main table before the last stage (negated
      route-exists).
    - The instance's table holds a route to the upstream loopback.
    - A ping from inside the instance to the upstream loopback succeeds.
    - The main table holds the customer prefix after the RIB group is applied.
    - The customer router answers a ping sourced from the upstream side.
    topology:
      nodes:
      - id: edge
        kind: vjunos-router
        role: Edge router hosting the instance and the RIB group
      - id: customer
        kind: vjunos-router
        role: Customer site router
      - id: upstream
        kind: vjunos-router
        role: Shared upstream service router
      links:
      - a: edge
        b: customer
      - a: edge
        b: upstream
    estimatedMinutes: 35
    rationale: Routing instances and RIB groups are the least visible parts of the
      PIR chapter. The named-table route check and ping inside an instance make them
      observable. Three nodes are the fewest that give a separate customer and a shared
      service.
