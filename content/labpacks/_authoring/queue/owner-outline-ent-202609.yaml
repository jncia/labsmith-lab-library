      objectives:
      - C05-C04V04
    topics:
    - IS-IS levels
    - L1/L2 router
    - attached bit
    scenario: An access router at a small site should only carry local IS-IS routing,
      while the backbone runs level 2. A middle router sits on the border of the two.
      The operator needs the access router to still reach the rest of the network.
    learnerOutcome: Configure IS-IS levels and areas so that an L1-only router reaches
      the backbone through an L1/L2 router.
    startStateSketch: Three routers in a line with addressed links, loopbacks and
      ISO addresses on the loopbacks, in two areas. No IS-IS is running yet.
    stageSketch:
    - title: Backbone at level 2
      achieves: The backbone router and the middle router are level 2 neighbours and
        exchange loopback routes.
    - title: Access at level 1
      achieves: The access router is a level 1 neighbour of the middle router, and
        the middle router runs both levels.
    - title: Reach the backbone from the access router
      achieves: The access router holds an IS-IS default route toward the middle router,
        and can ping the backbone loopback.
    observableOutcomes:
    - The backbone router has an IS-IS route for the middle router's loopback.
    - The middle router has IS-IS routes for the backbone and the access loopbacks.
    - The access router has an IS-IS default route pointing at the middle router.
    - The access router can ping the backbone loopback.
    topology:
      nodes:
      - id: backbone
        kind: vjunos-router
        role: Level 2 backbone router
      - id: l1l2
        kind: vjunos-router
        role: Router in both levels between backbone and access
      - id: access
        kind: vjunos-router
        role: Level 1 access router
      links:
      - a: backbone
        b: l1l2
      - a: l1l2
        b: access
    estimatedMinutes: 30
    rationale: Multi-level IS-IS is the main hands-on skill of the IS-IS chapter.
      The results appear in routing tables, so route-exists and ping observe them.
      Adjacency internals such as DIS election and PDU contents cannot be observed
      with the platform's checks.
