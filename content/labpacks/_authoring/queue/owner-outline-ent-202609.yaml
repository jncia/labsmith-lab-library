    id: isis-policy-leaking-3n
    title: Leak specific routes into level 1 and export a static route into IS-IS
    labType: build
    level: intermediate
    certifications:
    - JNCIS-ENT
    blueprint:
      examCode: OWNER-OUTLINE-ENT
      objectives:
      - C05-C04V05
    topics:
    - IS-IS export policy
    - route leaking
    - level 2 to level 1
    scenario: An access router uses a default route to reach the backbone, but one
      data-centre prefix needs a more specific route so traffic takes the right exit.
      In addition, a partner subnet learned by static route on the backbone side must
      be advertised into IS-IS. The operator wants both done with policy.
    learnerOutcome: Use IS-IS routing policy to leak a chosen level 2 route into level
      1 and to advertise an external route, and show the effect on the route tables.
    startStateSketch: 'A working two-level IS-IS network: backbone, L1/L2 and access
      routers. The access router only has a default route. The backbone router has
      a static route for the partner subnet that is not advertised.'
    stageSketch:
    - title: Advertise the partner subnet
      achieves: The L1/L2 router has an IS-IS route for the partner subnet, exported
        from the backbone router by policy.
    - title: Leak one prefix into level 1
      achieves: The access router holds a specific IS-IS route for the data-centre
        prefix, in addition to its default.
    - title: Keep the rest out
      achieves: The access router does not hold a specific route for the partner subnet,
        and everything still pings.
    observableOutcomes:
    - The L1/L2 router has an IS-IS route for the partner subnet.
    - The access router has an IS-IS route for the data-centre prefix.
    - The access router does not have a specific route for the partner subnet (negated
      route-exists).
    - The access router can still ping the data-centre and partner addresses.
    topology:
      nodes:
      - id: backbone
        kind: vjunos-router
        role: Backbone router with a partner static route and a data-centre prefix
      - id: l1l2
        kind: vjunos-router
        role: Level boundary router where leaking is applied
      - id: access
        kind: vjunos-router
        role: Level 1 access router that should see only selected routes
      links:
      - a: backbone
        b: l1l2
      - a: l1l2
        b: access
    estimatedMinutes: 35
    rationale: Follows the multi-level brief and practises a different skill, IS-IS
      policy. The presence and absence of routes on each router shows what the policy
      does.
- status: proposed
  priority: 100
  model: null
  ownerNote: ''
  brief:
    schemaVersion: 0
    id: bgp-ibgp-ebgp-next-hop-3n
    title: Fix an EBGP route that an internal router cannot use
    labType: build
    level: intermediate
    certifications:
    - JNCIS-ENT
    blueprint:
      examCode: OWNER-OUTLINE-ENT
      objectives:
      - C06-C06V04
      - C06-C06V01
    topics:
    - EBGP
    - IBGP
    - next-hop-self
    - split horizon
    scenario: A customer network has an EBGP session with an ISP. An internal router
      in the customer AS receives the ISP's route over IBGP but cannot forward to
      it. The engineer must find out why and fix it.
    learnerOutcome: Explain and fix the next-hop problem when EBGP routes are passed
      to IBGP peers, and confirm the session states and routes.
    startStateSketch: An ISP router, a customer edge router and a customer internal
      router. Loopbacks are reachable inside the customer AS through an IGP. The EBGP
      session is configured and the IBGP session is not.
    stageSketch:
    - title: Bring up the sessions
      achieves: The EBGP session and the IBGP session are both Established.
    - title: See the symptom
      achieves: The internal router has the ISP prefix in its BGP table but no usable
        route for it, because the next hop is the ISP's address, which it cannot resolve.
    - title: Make it usable
      achieves: The internal router has an active BGP route for the ISP prefix, with
        the edge router as next hop, and can ping the ISP loopback.
    observableOutcomes:
    - The EBGP neighbour is Established on the edge router.
    - The IBGP neighbour is Established on the internal router.
    - Before the fix, the internal router has no active route for the ISP prefix (negated
      route-exists).
    - After the fix, the internal router has a BGP route for the ISP prefix with the
      edge router as next hop.
    - The internal router can ping the ISP loopback.
    topology:
      nodes:
      - id: isp
        kind: vjunos-router
        role: ISP router in a different AS that originates a prefix
      - id: edge
        kind: vjunos-router
        role: Customer edge router with the EBGP session
      - id: internal
        kind: vjunos-router
        role: Customer internal router that only speaks IBGP
      links:
      - a: isp
        b: edge
      - a: edge
        b: internal
    estimatedMinutes: 30
    rationale: A candidate should be able to diagnose and fix this common BGP problem.
      Session state and route entries can be seen with the platform's checks. The
      five BGP message types and the state machine cannot be observed, so they are
      not covered.
- status: proposed
  priority: 100
  model: null
  ownerNote: ''
  brief:
    schemaVersion: 0
    id: bgp-dual-homed-policy-3n
    title: Steer a dual-homed customer with BGP import and export policy
    labType: build
    level: intermediate
    certifications:
    - JNCIS-ENT
    blueprint:
      examCode: OWNER-OUTLINE-ENT
      objectives:
      - C06-C06V02
      - C06-C06V05
      - C06-C06V06
    topics:
    - BGP path selection
    - local preference
    - import and export policy
    - BGP groups
    scenario: A customer connects to two ISPs that both advertise the same destination.
      Traffic currently uses whichever route wins by default, but the cheaper ISP
      should be preferred. The customer also must not advertise the ISP's routes to
      the other ISP, and only its own prefix should leave.
    learnerOutcome: Change BGP path selection with an import policy, limit what is
      advertised with an export policy, and prove both in the route tables.
    startStateSketch: A customer router with EBGP sessions to ISP A and ISP B, both
      Established, in a peer group. Both ISPs advertise the same destination prefix.
      The customer has a prefix of its own that is not yet advertised.
    stageSketch:
    - title: Confirm the default choice
      achieves: The customer router has two candidate routes for the destination,
        and one ISP is the active next hop by default.
    - title: Prefer the cheaper ISP
      achieves: The active route for the destination now has ISP B as next hop, chosen
        by policy.
    - title: Advertise only the customer's prefix
      achieves: Both ISPs hold the customer's prefix, and neither ISP holds a route
        for the other's prefix learned from the customer (no transit).
    observableOutcomes:
    - Both EBGP neighbours are Established.
    - The customer router has a route to the destination with ISP A as a next hop.
    - The customer router has a route to the destination with ISP B as next hop, and
      that one is the active one after the policy.
    - Each ISP has the customer's own prefix.
    - Each ISP does not have a route to the other ISP's own prefix through the customer
      (negated route-exists).
    topology:
      nodes:
      - id: customer
        kind: vjunos-router
        role: Dual-homed customer router where policy is applied
      - id: isp-a
        kind: vjunos-router
        role: First ISP; advertises the destination
      - id: isp-b
        kind: vjunos-router
        role: Second, preferred ISP; advertises the destination
      links:
      - a: customer
        b: isp-a
      - a: customer
        b: isp-b
    estimatedMinutes: 40
    rationale: This is the policy lab that closes the BGP chapter. The choice of next
      hop and the presence or absence of routes on each router show the effect. Troubleshooting
      with traceroute and logs is not covered because the platform cannot observe
      it.
- status: proposed
  priority: 100
  model: null
  ownerNote: ''
  brief:
    schemaVersion: 0
    id: lag-two-links-2n
    title: Combine two links into one aggregated Ethernet bundle
    labType: build
    level: intermediate
    certifications:
    - JNCIS-ENT
    blueprint:
      examCode: OWNER-OUTLINE-ENT
      objectives:
      - C08-C08V01
    topics:
    - link aggregation
    - aggregated Ethernet
    - member links
    scenario: Two routers are joined by two separate links that are each addressed
      on their own. The team wants one logical link that carries traffic over both
      and keeps working when one member fails.
    learnerOutcome: Build a link aggregation group over two member links, address
      it and show that it stays up when a member is lost.
    startStateSketch: Two routers with two links, each currently with its own address
      and a loopback on each router. Aggregated devices are already enabled in the
      start configuration, so no stage touches the chassis.
    stageSketch:
    - title: Move the links into a bundle
      achieves: The aggregated interface is up on both routers, with the two links
        as members and the old per-link addresses removed.
    - title: Address the bundle and route over it
      achieves: The aggregated interface has an address on each side, and each router
        has a route to the other's loopback over it, which pings.
    - title: Lose one member
      achieves: With one member link down, the aggregated interface stays up and the
        loopback still answers.
    observableOutcomes:
    - The aggregated interface is up on both routers.
    - Each router has a route to the other's loopback through the aggregated interface.
    - The loopbacks answer pings.
    - After one member link is disabled, that member is not up (negated interface-up),
      the aggregated interface is still up and the ping still succeeds.
    topology:
      nodes:
      - id: r1
        kind: vjunos-router
        role: First end of the bundle
      - id: r2
        kind: vjunos-router
        role: Second end of the bundle
      links:
      - a: r1
        b: r2
      - a: r1
        b: r2
    estimatedMinutes: 25
    rationale: Link aggregation is the one high-availability topic that a router-only
      platform can build and check with interface and ping checks. Whether traffic
      is spread over the members is not observable, so the brief stays with bundle
      state and survival of a member failure. Redundant trunk groups need switching
      and are skipped.
