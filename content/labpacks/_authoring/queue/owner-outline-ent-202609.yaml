  brief:
    schemaVersion: 0
    id: ospf-nssa-policy-default-3n
    title: Turn an access area into an NSSA and control what enters it
    labType: build
    level: intermediate
    certifications:
    - JNCIS-ENT
    blueprint:
      examCode: OWNER-OUTLINE-ENT
      objectives:
      - C04-C04V05
    topics:
    - NSSA
    - default originate
    - OSPF export policy
    - route tags
    scenario: An access area contains a router that connects to a small partner network
      by static route. The partner prefix must reach the backbone, but the area should
      not accept the full external route set. The operator wants the area to be an
      NSSA, with a default route from the border router and the partner prefix tagged
      on export.
    learnerOutcome: Configure an NSSA, originate a default into it and export an external
      route with a policy that tags it.
    startStateSketch: Backbone, border and access routers already running multi-area
      OSPF with loopbacks reachable. The access router has a static route to the partner
      prefix that is not yet advertised.
    stageSketch:
    - title: Make area 1 an NSSA
      achieves: The border and access routers are still neighbours after the area
        becomes not-so-stubby, and the loopbacks still ping.
    - title: Give the NSSA a default
      achieves: The access router has an OSPF-learned default route pointing at the
        border router.
    - title: Export the partner prefix with a tag
      achieves: The backbone router holds an OSPF external route for the partner prefix
        that carries the tag chosen by policy.
    observableOutcomes:
    - The access loopback and the backbone loopback answer pings after the area type
      change.
    - The access router has an OSPF default route with the border router as next hop.
    - The backbone router has an OSPF route for the partner prefix.
    - The partner route on the backbone router shows the policy's tag (route-exists
      on the prefix with OSPF as protocol).
    topology:
      nodes:
      - id: backbone
        kind: vjunos-router
        role: Backbone router that should learn the partner prefix
      - id: border
        kind: vjunos-router
        role: Area border router for the NSSA
      - id: access
        kind: vjunos-router
        role: NSSA router that redistributes the partner static route
      links:
      - a: backbone
        b: border
      - a: border
        b: access
    estimatedMinutes: 35
    rationale: Covers the policy and additional options lab in the OSPF chapter. It
      follows the multi-area brief and builds on that same shape. The tag on the route
      is not a separate check type, so the outcome is observed through the route entry,
      which the build should confirm can show it.
