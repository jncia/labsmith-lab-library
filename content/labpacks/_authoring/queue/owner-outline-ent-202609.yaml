  brief:
    schemaVersion: 0
    id: gre-tunnel-over-transit-3n
    title: Carry private subnets between two sites over a GRE tunnel
    labType: build
    level: intermediate
    certifications:
    - JNCIS-ENT
    blueprint:
      examCode: OWNER-OUTLINE-ENT
      objectives:
      - C07-C07V02
    topics:
    - GRE
    - tunnel interface
    - overlay routing
    scenario: Two sites need to exchange private subnets, but the provider router
      between them must not carry those subnets in its routing table. The team builds
      a GRE tunnel between the site routers and needs to prove that it works and that
      the provider stays unaware.
    learnerOutcome: Build a working GRE tunnel across a transit router, route inner
      subnets over it and check both the tunnel and the underlay.
    startStateSketch: Site A, a provider router and Site B with addressed links and
      loopbacks. The underlay already lets the two site loopbacks reach each other.
      Tunnel services are already enabled in the start configuration, so no stage
      touches the chassis. Each site has a private subnet on a loopback-style interface.
    stageSketch:
    - title: Bring the tunnel up
      achieves: A GRE tunnel interface is up on both site routers, with the tunnel
        endpoints being the site loopbacks, and the far tunnel address answers a ping.
    - title: Route the private subnets over it
      achieves: Each site router has a route to the other site's private subnet with
        the tunnel as the way out.
    - title: Prove the underlay stays clean
      achieves: The private subnets can ping each other end to end, and the provider
        router has no route for either private subnet.
    observableOutcomes:
    - The tunnel interface is up on Site A and on Site B.
    - The far tunnel address answers a ping from each site.
    - Each site has a route to the other's private subnet.
    - A ping between the two private subnets succeeds.
    - The provider router does not have either private subnet in its route table (negated
      route-exists).
    topology:
      nodes:
      - id: site-a
        kind: vjunos-router
        role: Site A tunnel endpoint
      - id: provider
        kind: vjunos-router
        role: Transit router that only knows the underlay
      - id: site-b
        kind: vjunos-router
        role: Site B tunnel endpoint
      links:
      - a: site-a
        b: provider
      - a: provider
        b: site-b
    estimatedMinutes: 35
    rationale: GRE is the hands-on part of the tunnels chapter. The tunnel interface,
      the routes over it and the absence of routes on the transit router can all be
      seen. It assumes the lab host's virtual router supports tunnel interfaces once
      tunnel services are set in the start state, which should be confirmed before
      building. IP-IP would be a variation on this and is left for a later batch.
