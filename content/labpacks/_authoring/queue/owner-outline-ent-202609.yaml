  brief:
    schemaVersion: 0
    id: ecmp-load-balancing-static-2n
    title: Share traffic over two equal links with ECMP
    labType: build
    level: intermediate
    certifications:
    - JNCIS-ENT
    blueprint:
      examCode: OWNER-OUTLINE-ENT
      objectives:
      - C03-C03V04
    topics:
    - ECMP
    - load balancing policy
    - forwarding table
    scenario: Two routers are joined by two parallel links and only one link carries
      traffic, so the second sits idle. The operator wants both links in use for traffic
      to a remote loopback and wants to know the network survives if one link is lost.
    learnerOutcome: Get a route with two next hops into the forwarding table as a
      load-shared entry, and show what happens when one path fails.
    startStateSketch: Two routers with two addressed links between them and a loopback
      on the far router. The near router has no route to that loopback.
    stageSketch:
    - title: Learn the loopback over both links
      achieves: The near router has a route to the far loopback listing next hops
        over both links, and the loopback answers a ping.
    - title: Install both paths for forwarding
      achieves: The forwarding table entry for the loopback holds both next hops as
        a load-shared set, not just one.
    - title: Lose one link
      achieves: With one link taken down, the forwarding entry keeps only the surviving
        next hop and the loopback still answers.
    observableOutcomes:
    - The near router has a route for the far loopback with the next hop on the first
      link.
    - The near router has a route for the far loopback with the next hop on the second
      link.
    - The forwarding table entry for the loopback is a multi-next-hop (unilist) entry.
    - The loopback answers ping at full success rate.
    - After the failure, the affected interface is not up (negated interface-up check)
      and the loopback still answers ping.
    topology:
      nodes:
      - id: near
        kind: vjunos-router
        role: Router that must spread traffic over two links
      - id: far
        kind: vjunos-router
        role: Router that owns the destination loopback
      links:
      - a: near
        b: far
      - a: near
        b: far
    estimatedMinutes: 25
    rationale: Covers the ECMP part of load balancing with two nodes. The route table
      and forwarding table are both observable. How flows are hashed (per-flow versus
      per-packet) cannot be observed with the platform's checks, so the brief stays
      on how the forwarding entry is built.
