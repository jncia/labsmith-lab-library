system {
    host-name hq;
}
interfaces {
    ge-0/0/0 {
        unit 0 {
            family inet {
                address 10.0.12.2/30;
            }
        }
    }
    ge-0/0/1 {
        unit 0 {
            family inet {
                address 10.0.23.1/30;
            }
        }
    }
    lo0 {
        unit 0 {
            family inet {
                address 192.168.255.2/32;
                address 172.16.0.1/24;
                address 172.16.1.1/24;
            }
        }
    }
}
routing-options {
    autonomous-system 65002;
}
protocols {
    bgp {
        group upstream {
            type external;
            peer-as 65003;
            neighbor 10.0.23.2;
        }
    }
}
