system {
    host-name upstream;
}
interfaces {
    ge-0/0/0 {
        unit 0 {
            family inet {
                address 10.0.23.2/30;
            }
        }
    }
    lo0 {
        unit 0 {
            family inet {
                address 192.168.255.3/32;
            }
        }
    }
}
routing-options {
    autonomous-system 65003;
}
protocols {
    bgp {
        group hq {
            type external;
            peer-as 65002;
            neighbor 10.0.23.1;
        }
    }
}
