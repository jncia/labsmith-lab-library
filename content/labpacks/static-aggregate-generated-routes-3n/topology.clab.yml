name: static-aggregate-generated-routes-3n
topology:
  kinds:
    juniper_vjunosrouter:
      image: ${VJUNOS_ROUTER_IMAGE:=vrnetlab/juniper_vjunos-router:26.2R1.7}
  nodes:
    branch:
      kind: juniper_vjunosrouter
      startup-config: configs/branch.cfg
    hq:
      kind: juniper_vjunosrouter
      startup-config: configs/hq.cfg
    upstream:
      kind: juniper_vjunosrouter
      startup-config: configs/upstream.cfg
  links:
    - endpoints: ["branch:eth1", "hq:eth1"]
    - endpoints: ["hq:eth2", "upstream:eth1"]
