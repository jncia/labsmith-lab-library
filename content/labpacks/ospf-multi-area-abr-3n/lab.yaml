schemaVersion: 0
id: ospf-multi-area-abr-3n
title: Split a growing OSPF network into a backbone and a second area
summary: Three routers in a line start with core and abr in OSPF area 0. You bring
  the access router into area 1 with abr as the area border router, then advertise
  the access loopback so the backbone learns it as an inter-area route. Reachability
  is proved in both directions.
labType: build
level: intermediate
certifications:
- JNCIS-ENT
topics:
- OSPF areas
- ABR
- inter-area routes
estimatedMinutes: 25
nodes:
- id: core
  kind: juniper_vjunosrouter
  role: Backbone router
- id: abr
  kind: juniper_vjunosrouter
  role: Area border router between area 0 and area 1
- id: access
  kind: juniper_vjunosrouter
  role: Access router in area 1
requirements:
  images:
  - kind: juniper_vjunosrouter
    version: 26.2R1.7
    obtainFrom: Build the container image from the vendor's virtual router release
      with vrnetlab, then load it on the lab host.
  minimumFreeMemoryGb: 18
  minimumCores: 12
stages:
- id: stage1
  title: Join the access router in area 1
  goal: 'Bring access into the OSPF network as a member of a non-backbone area, area
    1. abr must end up with one interface in area 0 and one in area 1, so it borders
    both, and access must learn the backbone routes across that border. Follow the
    design: the transit link is point-to-point. Do not touch the existing area 0 configuration
    on core and abr.'
  doneWhen:
  - access has OSPF routes for the core loopback and for the core-to-abr link, and
    both are learned via abr's address on the access link.
  - access can ping the core loopback with no loss.
- id: stage2
  title: Advertise the access loopback across the border
  goal: Make the access loopback reachable from the backbone, so that core learns
    it as an inter-area route and the two loopbacks answer each other in both directions.
    The loopback must be advertised without trying to form an adjacency on it, and
    it must sit in the same area as the rest of access.
  doneWhen:
  - abr has an OSPF route for the access loopback, learned from access.
  - core has an OSPF route for the access loopback, learned via abr.
  - core can ping the access loopback with no loss.
