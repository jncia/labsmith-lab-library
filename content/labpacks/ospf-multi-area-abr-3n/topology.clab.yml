name: ospf-multi-area-abr-3n
topology:
  kinds:
    juniper_vjunosrouter:
      image: ${VJUNOS_ROUTER_IMAGE:=vrnetlab/juniper_vjunos-router:26.2R1.7}
  nodes:
    core:
      kind: juniper_vjunosrouter
      startup-config: configs/core.cfg
    abr:
      kind: juniper_vjunosrouter
      startup-config: configs/abr.cfg
    access:
      kind: juniper_vjunosrouter
      startup-config: configs/access.cfg
  links:
    - endpoints: ["core:eth1", "abr:eth1"]
    - endpoints: ["abr:eth2", "access:eth1"]
