schemaVersion: 0
id: jncia-loopback-filter-1n
title: Selective ICMP Access to Local Router Endpoints
summary: r1 carries four loopback addresses and a loopback input filter that discards
  ICMP to some of them. You correct the filter in two stages so 192.0.2.10 and 192.0.2.20
  answer while 192.0.2.30 stays silent.
labType: build
level: associate
certifications:
- JNCIA-Junos
topics:
- loopback firewall filtering
- filter term order
- ICMP match criteria
- accept and discard actions
- operational verification
estimatedMinutes: 25
nodes:
- id: r1
  kind: juniper_vjunosrouter
  role: Local ICMP access controlled by a loopback filter
requirements:
  images:
  - kind: juniper_vjunosrouter
    version: 26.2R1.7
    obtainFrom: Build the container image from the vendor's virtual router release
      with vrnetlab, then load it on the lab host.
  minimumFreeMemoryGb: 8
  minimumCores: 4
stages:
- id: s1
  title: Restore the first service
  goal: Make 192.0.2.10 answer probes from r1 again. Don't weaken the filter for the
    other addresses, and don't remove the filter.
  doneWhen:
  - Three of three pings from r1 to 192.0.2.10 get replies.
  - The diagnostic address 192.0.2.254 still answers.
- id: s2
  title: Complete the service access policy
  goal: Allow 192.0.2.20 and deny 192.0.2.30 while keeping .10 reachable. The denial
    must apply to ICMP to .30 only.
  doneWhen:
  - Three of three pings from r1 to 192.0.2.20 get replies.
  - Zero of three pings from r1 to 192.0.2.30 get replies.
  - 192.0.2.10 still answers.
