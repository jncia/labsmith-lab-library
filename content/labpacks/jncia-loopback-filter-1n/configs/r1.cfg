system {
    host-name r1;
}
interfaces {
    ge-0/0/0 {
        unit 0 {
            family inet {
                address 198.51.100.1/30;
            }
        }
    }
    ge-0/0/1 {
        unit 0 {
            family inet {
                address 198.51.100.5/30;
            }
        }
    }
    lo0 {
        unit 0 {
            family inet {
                filter {
                    input lo0-icmp;
                }
                address 192.0.2.254/32;
                address 192.0.2.10/32;
                address 192.0.2.20/32;
                address 192.0.2.30/32;
            }
        }
    }
}
firewall {
    family inet {
        filter lo0-icmp {
            term deny-icmp {
                from {
                    destination-address {
                        192.0.2.10/32;
                        192.0.2.20/32;
                    }
                    protocol icmp;
                }
                then {
                    discard;
                }
            }
            term allow-rest {
                then accept;
            }
        }
    }
}
